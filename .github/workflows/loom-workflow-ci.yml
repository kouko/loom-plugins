name: loom-workflow CI

# Runs the loom-workflow plugin's shell test suite
# (loom-workflow/tests/test-*.sh), which previously ran in NO workflow —
# including the three memory-grep tests
# (test-memory-grep-match.sh / test-memory-grep-supersedes.sh /
# test-memory-grep-verify.sh) that pin memory-grep.sh's frozen exit-code
# contract. A regression there had no CI gate to catch it.
#
# Three jobs: the shell suite (glob over loom-workflow/tests/test-*.sh),
# a mermaid job that parses every mermaid block loom-visualization ships
# (see that job's comment), and a pytest job that runs both the loom-visualization page script suite and every
# skill's own `scripts/test_*.py` suite (loom-workflow/scripts/ plus each
# loom-workflow/skills/<skill>/scripts/, discovered by glob — never a
# named list, so a skill added after this file was written is covered
# without another edit here). Each directory is its own pytest invocation
# because two different skills can legitimately ship a same-named test
# file (e.g. test_readmes.py, test_skill_md.py); running them all in one
# pytest process would trip Python's module-identity check on the
# collision. The post-merge HEAD-body check
# (memory-grep.sh --verify-merged) lives in its own workflow file,
# memory-verify-merged.yml — it needs an unfiltered push-to-main trigger
# (a memory-worthy PR usually touches paths OTHER than loom-workflow/**),
# which this file's `paths:`-scoped triggers cannot provide without
# losing their scoping for this job. See that file's header for the
# full reasoning.
#
# Status: intended for `main` branch protection.

on:
  pull_request:
    branches: [main]
    paths:
      - 'loom-workflow/**'
      - '.github/workflows/loom-workflow-ci.yml'
  push:
    branches: [main]
    paths:
      - 'loom-workflow/**'
      - '.github/workflows/loom-workflow-ci.yml'

permissions:
  contents: read

jobs:
  shell-tests:
    name: loom-workflow shell tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run loom-workflow/tests shell suite
        run: python3 scripts/run_package_tests.py --loom-family --only workflow-shell

  # loom-visualization page mode ships two scripts whose contract is
  # prose-heavy — a leftover-markdown gate, a staleness stamp, a mermaid
  # spec checker. Their regression history lived in code comments until it
  # was turned into tests; a suite no workflow runs is the same dead letter
  # the comments were, so it gets a job here.
  #
  # The suite lives in loom-workflow/tests/, NOT beside the scripts it
  # tests: pytest run inside a skill creates __pycache__/ and
  # .pytest_cache/ there, which this repo's skill-folder hook forbids, so
  # the skill's own tests would lock the skill against further editing.
  loom-visualization-page-pytest:
    name: loom-visualization page script tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pinned, like every other external surface on this branch
      # (checkout@v4, setup-python@v5, mermaid@11.16.0). The renderer is
      # stdlib-only, so no markdown parser is installed: CI tests exactly
      # what runs on a machine with plain Python.
      - name: Install test dependencies
        run: python3 -m pip install --quiet 'pytest~=8.3'

      - name: Run loom-visualization page script tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/run_package_tests.py --loom-family --only workflow-python -v

  # Every mermaid block in loom-visualization's templates/ and references/
  # must parse under Mermaid's own parser (pinned in the committed lockfile).
  # The group has no skip path: without node it fails.
  loom-visualization-mermaid:
    name: loom-visualization mermaid validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate loom-visualization mermaid blocks
        run: python3 scripts/run_package_tests.py --loom-family --only workflow-mermaid
